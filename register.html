<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daftar — SuruhBeli</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="login.css" />
</head>
<body>

  <div class="blob blob-top"></div>
  <div class="blob blob-bottom"></div>

  <main class="page">

    <div class="brand">
      <img src="logo.png" alt="SuruhBeli" class="brand-logo" />
      <h1 class="brand-name"><span class="brand-suruh">Suruh</span><span class="brand-beli">Beli</span></h1>
      <p class="brand-tagline">Males keluar? <span>SuruhBeli</span> aja.</p>
    </div>

    <div class="card">
      <h2 class="card-title">Buat akun baru</h2>
      <p class="card-subtitle">Daftar untuk mulai pakai SuruhBeli</p>

      <form id="register-form" novalidate>

        <div class="field">
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.7"/><path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </span>
          <input type="text" id="name" name="name" placeholder="Nama lengkap" autocomplete="name" required />
        </div>

        <div class="field">
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M3 6.5C3 5.67 3.67 5 4.5 5h15c.83 0 1.5.67 1.5 1.5v11c0 .83-.67 1.5-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11Z" stroke="currentColor" stroke-width="1.7"/><path d="m4 6.5 8 6.2 8-6.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required />
        </div>

        <div class="field">
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </span>
          <input type="password" id="password" name="password" placeholder="Password (min. 6 karakter)" autocomplete="new-password" required />
          <button type="button" class="field-toggle" id="toggle-password" aria-label="Tampilkan password">
            <svg viewBox="0 0 24 24" fill="none"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg>
          </button>
        </div>

        <p class="form-error" id="form-error" role="alert" hidden></p>

        <button type="submit" class="btn-primary" id="submit-btn" style="margin-top: 4px;">
          <span id="submit-label">Daftar</span>
        </button>

        <p class="signup-line" style="margin-top: 16px;">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>

      </form>
    </div>

  </main>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="register.js"></script>
</body>
</html>
